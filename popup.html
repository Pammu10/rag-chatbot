<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page2Chat RAG</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Page2Chat RAG</h1>
      <p class="sub">Scrape this page and chat with it.</p>

      <label for="apiKey">OpenAI API key</label>
      <input id="apiKey" type="password" placeholder="sk-..." />

      <div class="row">
        <button id="scrapeBtn">Scrape Page</button>
        <button id="clearBtn" class="secondary">Clear Page Data</button>
      </div>

      <p id="status" class="status"></p>

      <section id="chat" class="chat"></section>

      <form id="askForm">
        <input id="question" type="text" placeholder="Ask a question about this page" required />
        <button type="submit">Ask</button>
      </form>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
